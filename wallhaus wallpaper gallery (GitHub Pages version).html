<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>wallhaus · Wallpapers</title>
<style>
  :root { --bg:#0f1114; --fg:#eef0f4; --muted:#8a909c; --card:#171a20; --line:#2a2f38; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  html, body { overflow-x:hidden; max-width:100%; }
  canvas#net { position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:0; pointer-events:none; }
  header, main, footer { position:relative; z-index:1; }
  nav { display:flex; justify-content:space-between; align-items:center; padding:24px 56px; }
  .logo { font-weight:900; font-size:22px; letter-spacing:-.02em; transform:scaleX(1.25); transform-origin:left; }
  nav a { color:var(--muted); text-decoration:none; font-size:15px; }
  nav a:hover { color:var(--fg); }
  .hero { padding:90px 56px 60px; }
  .hero h1 { font-weight:900; font-size:clamp(64px,13vw,190px); letter-spacing:-.04em;
    line-height:.9; margin:0; transform:scaleX(1.15); transform-origin:left; }
  .hero p { color:var(--muted); max-width:420px; line-height:1.5; margin:28px 0; }
  .btn { display:inline-block; background:var(--fg); color:#0f1114; padding:14px 26px; border-radius:999px;
    text-decoration:none; font-weight:600; font-size:15px; border:0; cursor:pointer; }
  .filters { display:flex; gap:10px; padding:0 56px; flex-wrap:wrap; }
  .chip { background:transparent; border:1px solid var(--line); color:var(--fg); padding:10px 20px;
    border-radius:999px; cursor:pointer; font-size:14px; font-family:inherit; }
  .chip.on { background:var(--fg); color:#0f1114; border-color:var(--fg); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:20px;
    padding:32px 56px 80px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden;
    cursor:pointer; transition:transform .2s, border-color .2s; }
  .card:hover { transform:translateY(-4px); border-color:#3a4150; }
  .card.hidden { display:none; }
  .thumb { aspect-ratio:16/10; background-color:#111; }
  .meta { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; font-size:15px; gap:8px; }
  .meta small { color:var(--muted); white-space:nowrap; }
  #viewer { position:fixed; inset:0; z-index:10; display:none; flex-direction:column;
    justify-content:space-between; padding:24px; background:#000 center/contain no-repeat; }
  #viewer.open { display:flex; }
  #viewer .bar { display:flex; justify-content:space-between; align-items:center; }
  #viewer .bar button, #viewer .btn { background:rgba(15,17,20,.6); color:var(--fg); border:1px solid var(--line);
    padding:10px 18px; border-radius:999px; cursor:pointer; font-family:inherit; backdrop-filter:blur(6px); }
  #viewer .caption { align-self:flex-start; background:rgba(15,17,20,.6); padding:10px 16px; border-radius:12px; font-size:15px; }
  footer { padding:24px 56px 40px; color:var(--muted); font-size:14px; }
  @media (max-width:640px) {
    nav, .hero, .filters, .grid, footer { padding-left:20px; padding-right:20px; }
    .hero { padding-top:50px; }
  }
</style>
</head>
<body>
<canvas id="net"></canvas>
<header>
  <nav>
    <div class="logo">wallhaus</div>
    <a href="#gallery">Wallpapers</a>
  </nav>
  <section class="hero">
    <h1>wallhaus</h1>
    <p>Wallpapers for your phone and desktop. Pick a style, preview it full screen, and set it as your background.</p>
    <a class="btn" href="#gallery">Browse wallpapers</a>
  </section>
</header>
<main id="gallery">
  <div class="filters" id="filters">
    <button class="chip on" data-f="all">All</button>
    <button class="chip" data-f="4k">4K</button>
    <button class="chip" data-f="desktop">Laptop &amp; Desktop</button>
    <button class="chip" data-f="phone">Phone</button>
  </div>
  <div class="grid" id="grid"></div>
</main>
<div id="viewer">
  <div class="bar">
    <button id="close">← Back</button>
    <a class="btn" id="download" href="#" download>Download</a>
  </div>
  <div class="caption" id="caption"></div>
</div>
<footer>© 2026 wallhaus</footer>
<script>
  // Wallpapers are embedded below. Each has a thumb (grid) and full (preview) image.
  const WALLPAPERS = [{"name": "Ember Gaze", "cats": ["desktop"], "res": "Desktop", "thumb": "wallpapers/thumbs/00.jpg", "full": "wallpapers/00.jpg"}, {"name": "Blue Night City", "cats": ["desktop"], "res": "Desktop", "thumb": "wallpapers/thumbs/01.jpg", "full": "wallpapers/01.jpg"}, {"name": "Bandaged Stare", "cats": ["desktop"], "res": "Desktop", "thumb": "wallpapers/thumbs/02.jpg", "full": "wallpapers/02.jpg"}, {"name": "Knight in Blossoms", "cats": ["desktop"], "res": "Desktop", "thumb": "wallpapers/thumbs/03.jpg", "full": "wallpapers/03.jpg"}, {"name": "Black Rose Knight", "cats": ["desktop"], "res": "Desktop", "thumb": "wallpapers/thumbs/04.jpg", "full": "wallpapers/04.jpg"}, {"name": "Whatever Doesn't Kill Us", "cats": ["desktop"], "res": "Desktop", "thumb": "wallpapers/thumbs/05.jpg", "full": "wallpapers/05.jpg"}, {"name": "Monster Ultra", "cats": ["desktop"], "res": "Desktop", "thumb": "wallpapers/thumbs/06.jpg", "full": "wallpapers/06.jpg"}, {"name": "Berserk Blade", "cats": ["desktop"], "res": "Desktop", "thumb": "wallpapers/thumbs/07.jpg", "full": "wallpapers/07.jpg"}, {"name": "Silver Hour", "cats": ["4k", "desktop"], "res": "4K \u00b7 Desktop", "thumb": "wallpapers/thumbs/08.jpg", "full": "wallpapers/08.jpg"}, {"name": "Gojo Glasses", "cats": ["desktop"], "res": "Desktop", "thumb": "wallpapers/thumbs/09.jpg", "full": "wallpapers/09.jpg"}, {"name": "Crystal Eyes", "cats": ["desktop"], "res": "Desktop", "thumb": "wallpapers/thumbs/10.jpg", "full": "wallpapers/10.jpg"}, {"name": "Lone Tree", "cats": ["4k", "desktop"], "res": "4K \u00b7 Desktop", "thumb": "wallpapers/thumbs/11.jpg", "full": "wallpapers/11.jpg"}, {"name": "Ghost", "cats": ["4k", "desktop"], "res": "4K \u00b7 Desktop", "thumb": "wallpapers/thumbs/12.jpg", "full": "wallpapers/12.jpg"}, {"name": "Spider Web", "cats": ["desktop"], "res": "Desktop", "thumb": "wallpapers/thumbs/13.jpg", "full": "wallpapers/13.jpg"}, {"name": "Orange Scarf", "cats": ["desktop"], "res": "Desktop", "thumb": "wallpapers/thumbs/14.jpg", "full": "wallpapers/14.jpg"}, {"name": "Ice Veil", "cats": ["desktop"], "res": "Desktop", "thumb": "wallpapers/thumbs/15.jpg", "full": "wallpapers/15.jpg"}, {"name": "Asta Shadow", "cats": ["phone"], "res": "Phone", "thumb": "wallpapers/thumbs/16.jpg", "full": "wallpapers/16.jpg"}, {"name": "Fourth Flame", "cats": ["phone"], "res": "Phone", "thumb": "wallpapers/thumbs/17.jpg", "full": "wallpapers/17.jpg"}, {"name": "Manga Panels", "cats": ["phone"], "res": "Phone", "thumb": "wallpapers/thumbs/18.jpg", "full": "wallpapers/18.jpg"}, {"name": "Berserk Eyes", "cats": ["phone"], "res": "Phone", "thumb": "wallpapers/thumbs/19.jpg", "full": "wallpapers/19.jpg"}, {"name": "Ronin Silhouette", "cats": ["phone"], "res": "Phone", "thumb": "wallpapers/thumbs/20.jpg", "full": "wallpapers/20.jpg"}, {"name": "Steel Chain", "cats": ["phone"], "res": "Phone", "thumb": "wallpapers/thumbs/21.jpg", "full": "wallpapers/21.jpg"}, {"name": "Monochrome Bill", "cats": ["phone"], "res": "Phone", "thumb": "wallpapers/thumbs/22.jpg", "full": "wallpapers/22.jpg"}];

  const grid = document.getElementById("grid");
  const viewer = document.getElementById("viewer");

  function render() {
    grid.innerHTML = "";
    WALLPAPERS.forEach((w, i) => {
      const el = document.createElement("article");
      el.className = "card";
      el.dataset.cats = w.cats.join(" ");
      el.innerHTML = `<div class="thumb" style="background:url('${w.thumb}') center/cover"></div>
        <div class="meta"><span>${w.name}</span><small>${w.res}</small></div>`;
      el.addEventListener("click", () => openViewer(i));
      grid.appendChild(el);
    });
  }

  function openViewer(i) {
    const w = WALLPAPERS[i];
    viewer.style.background = `#000 url('${w.full}') center/contain no-repeat`;
    document.getElementById("caption").textContent = `${w.name} · ${w.res}`;
    const dl = document.getElementById("download");
    dl.href = w.full;
    dl.download = w.name.toLowerCase().replace(/[^a-z0-9]+/g, "-") + ".jpg";
    viewer.classList.add("open");
  }
  document.getElementById("close").onclick = () => viewer.classList.remove("open");
  document.addEventListener("keydown", e => { if (e.key === "Escape") viewer.classList.remove("open"); });

  document.getElementById("filters").addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === chip));
    const f = chip.dataset.f;
    document.querySelectorAll(".card").forEach(card => {
      const show = f === "all" || card.dataset.cats.split(" ").includes(f);
      card.classList.toggle("hidden", !show);
    });
  });

  // Animated network background
  const canvas = document.getElementById("net");
  const ctx = canvas.getContext("2d");
  let pts = [];
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.min(90, Math.floor(innerWidth * innerHeight / 16000));
    pts = Array.from({ length: n }, () => ({
      x: Math.random() * innerWidth, y: Math.random() * innerHeight,
      vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25,
      s: Math.random() < .15 ? 3 : 1.5,
    }));
  }
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of pts) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > innerWidth) p.vx *= -1;
      if (p.y < 0 || p.y > innerHeight) p.vy *= -1;
    }
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
      if (d < 160) {
        ctx.strokeStyle = `rgba(238,240,244,${(1 - d / 160) * .35})`;
        ctx.lineWidth = .8;
        ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke();
      }
    }
    ctx.fillStyle = "rgba(238,240,244,.8)";
    for (const p of pts) ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    requestAnimationFrame(tick);
  }
  addEventListener("resize", resize);
  resize(); render(); tick();
</script>
</body>
</html>
