<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constellation sphere · drag to rotate</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#0f1114; color:#eef0f4; font-family:Inter, system-ui, -apple-system, "Segoe UI", sans-serif; padding:0; overflow:hidden; }
  h1 { font-weight:800; font-size:26px; margin:0; position:fixed; top:24px; left:24px; z-index:2; pointer-events:none; }
  p.sub { color:#8a909c; margin:0; font-size:14px; position:fixed; top:60px; left:24px; right:24px; z-index:2; pointer-events:none; }
  .stage { position:fixed; inset:0; background:#000; overflow:hidden; }
  canvas { width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  canvas.drag { cursor:grabbing; }
  .hint { position:absolute; left:0; right:0; bottom:12px; text-align:center; font-size:12px; color:#8a909c; pointer-events:none; }
</style>
</head>
<body>
<h1>Constellation sphere</h1>
<p class="sub">It turns on its own. Drag in any direction to turn it. Scroll or pinch to move it closer or farther.</p>
<div class="stage">
  <canvas id="sphere"></canvas>
  <div class="hint">drag to turn · scroll or pinch to zoom</div>
</div>
<script>
const canvas = document.getElementById("sphere");
const g = canvas.getContext("2d");
let W, H, dpr;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = canvas.getBoundingClientRect();
  W = r.width; H = r.height;
  canvas.width = W * dpr; canvas.height = H * dpr;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
addEventListener("resize", resize);

// Dots scattered through open space (a volume, not a shell)
const N = 380;
const dots = Array.from({ length: N }, () => {
  const u = Math.random() * 2 - 1;           // cos(phi)
  const th = Math.random() * Math.PI * 2;
  const s = Math.sqrt(1 - u * u);
  const r = Math.cbrt(Math.random());        // fills the inside evenly
  return { x: r * s * Math.cos(th), y: r * u, z: r * s * Math.sin(th) };
});

const AUTO = 0.0015;           // slow automatic spin
let tilt = 0.35, zoom = 0.7;            // fixed tilt so the sphere looks 3D
let angle = 0, vel = AUTO;    // vel = current spin speed
let dragging = false, lastX = 0, lastY = 0;
const ptrs = new Map(); let pinchD = 0;

canvas.addEventListener("pointerdown", e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY; ptrs.set(e.pointerId, e); canvas.classList.add("drag");
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", e => {
  if (!dragging) return;
  ptrs.set(e.pointerId, e);
  if (ptrs.size === 2) {                     // two fingers: pinch to zoom
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (pinchD) zoom = Math.min(2.5, Math.max(0.25, zoom * d / pinchD));
    pinchD = d; return;
  }
  const dx = e.clientX - lastX; lastX = e.clientX;
  const dy = e.clientY - lastY; lastY = e.clientY;
  tilt = Math.max(-1.5, Math.min(1.5, tilt + dy * 0.004));   // up/down tilts it
  angle += dx * 0.005;
  vel = dx * 0.0025;             // dragging sets the spin direction and speed
});
function endDrag(e) {
  ptrs.delete(e.pointerId); pinchD = 0;
  const rest = [...ptrs.values()][0];
  if (rest) { lastX = rest.clientX; lastY = rest.clientY; return; }
  dragging = false; canvas.classList.remove("drag");
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);
canvas.addEventListener("wheel", e => {      // scroll: move it farther or closer
  e.preventDefault();
  zoom = Math.min(2.5, Math.max(0.25, zoom * Math.exp(-e.deltaY * 0.001)));
}, { passive: false });

function frame() {
  g.clearRect(0, 0, W, H);
  if (!dragging) {
    // Ease back toward the automatic speed after a drag
    vel += (AUTO - vel) * 0.015;
  }
  angle += vel;

  const cx = W / 2, cy = H / 2;
  const R = Math.hypot(W, H) * 0.6 * zoom;
  const cosA = Math.cos(angle), sinA = Math.sin(angle);
  const cosT = Math.cos(tilt), sinT = Math.sin(tilt);

  // Project every dot once per frame
  const p = dots.map(d => {
    const x1 = d.x * cosA - d.z * sinA;
    const z1 = d.x * sinA + d.z * cosA;
    const y1 = d.y * cosT - z1 * sinT;
    const z2 = d.y * sinT + z1 * cosT;
    const k = 1 / (1 + z2 * 0.35);          // closer dots look bigger
    return { x: cx + x1 * R * k, y: cy + y1 * R * k, z: z2, k };
  });

  // Links between nearby dots
  g.lineWidth = 1;
  for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
    const a = p[i], b = p[j];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    const lim = R * 0.25;
    if (d < lim) {
      const depth = (a.z + b.z + 2) / 4;   // 0 back .. 1 front
      g.strokeStyle = `rgba(255,255,255,${(1 - d / lim) * (0.3 + depth * 0.6)})`;
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
    }
  }

  // Dots, bigger when closer to the viewer
  for (const q of p) {
    const depth = (q.z + 1) / 2;
    g.fillStyle = `rgba(255,255,255,${0.35 + depth * 0.65})`;
    g.beginPath(); g.arc(q.x, q.y, 1.2 + q.k * 1.4, 0, Math.PI * 2); g.fill();
  }
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
